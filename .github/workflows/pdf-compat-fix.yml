name: PDF compatibility hotfix

on:
  push:
    branches: [chore/professional-foundation]
    paths:
      - '.github/workflows/pdf-compat-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/professional-foundation
          fetch-depth: 0

      - name: Patch PDF.js compatibility and add regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs':
                  'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.mjs',
              'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs':
                  'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.mjs',
          }

          for filename in ['docs/app.js', 'app.js']:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'Expected PDF.js URLs were not found in {filename}')
              path.write_text(text, encoding='utf-8')

          Path('tests/pdf-compat.test.js').write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';

          for (const path of ['docs/app.js', 'app.js']) {
            test(`${path} pins the browser-compatible legacy PDF.js build`, () => {
              const source = fs.readFileSync(path, 'utf8');
              assert.match(source, /pdfjs-dist@4\.10\.38\/legacy\/build\/pdf\.mjs/);
              assert.match(source, /pdfjs-dist@4\.10\.38\/legacy\/build\/pdf\.worker\.mjs/);
              assert.doesNotMatch(source, /pdfjs-dist@6\.3\.289/);
            });
          }
          ''', encoding='utf-8')

          Path('.github/workflows/pdf-compat-fix.yml').unlink()
          PY

      - name: Run project CI
        run: npm run ci

      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use compatible PDF.js legacy build"
          git push origin HEAD:chore/professional-foundation
